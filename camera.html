<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121517">
<title>MeasureVision — Camera</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__brand"><span class="dot"></span>Camera</div>
    <div class="topbar__actions">
      <span class="badge badge--warn">Belum kalibrasi</span>
    </div>
  </header>

  <main class="screen" style="padding-top: var(--sp-4);">
    <div class="viewfinder" style="margin-bottom: var(--sp-4);">
      <div class="viewfinder__grid"></div>
      <div class="viewfinder__hud">
        <span class="badge badge--neutral">Auto</span>
        <span class="badge badge--neutral mono">1x</span>
      </div>
      <div class="viewfinder__corners">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="viewfinder__object">
        <div class="viewfinder__dim-label">? mm — kalibrasi diperlukan</div>
      </div>
    </div>

    <div class="segmented" role="tablist" aria-label="Mode deteksi" style="margin-bottom: var(--sp-6);">
      <div class="segmented__opt" role="tab" aria-selected="true">Marker</div>
      <div class="segmented__opt" role="tab" aria-selected="false">Edge</div>
      <div class="segmented__opt" role="tab" aria-selected="false">Manual</div>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap: var(--sp-8); margin-bottom: var(--sp-6);">
      <button class="icon-btn" aria-label="Galeri" style="width:44px;height:44px;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m5 17 4.5-5 3 3.5L16 12l3 5"/></svg>
      </button>
      <button class="shutter" aria-label="Ambil gambar"><span class="shutter__inner"></span></button>
      <button class="icon-btn" aria-label="Ganti kamera" style="width:44px;height:44px;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 20 5.5l-3 3"/><path d="M20 5.5H8a5 5 0 0 0-5 5"/><path d="M7 21.5 4 18.5l3-3"/><path d="M4 18.5h12a5 5 0 0 0 5-5"/></svg>
      </button>
    </div>

    <div class="card card--pad">
      <p class="eyebrow" style="margin-bottom:6px;">Petunjuk</p>
      <p style="font-size: var(--fs-sm); color: var(--text-secondary);">Letakkan marker referensi sejajar dengan objek sebelum mengambil gambar. Pastikan pencahayaan merata.</p>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a class="bottom-nav__item" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9.5a1 1 0 0 0 1 1h3.5v-6h5v6H18a1 1 0 0 0 1-1V10"/></svg>
      <span>Home</span>
    </a>
    <a class="bottom-nav__item" href="camera.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1-2h7l1 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.25"/></svg>
      <span>Camera</span>
    </a>
    <a class="bottom-nav__item" href="calibration.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Calib.</span>
    </a>
    <a class="bottom-nav__item" href="measurement.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="1"/><path d="M7 8.5v3M11 8.5v3M15 8.5v3M19 8.5v3"/></svg>
      <span>Measure</span>
    </a>
    <a class="bottom-nav__item" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>History</span>
    </a>
  </nav>

</div>
</body>
</html>
