<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121517">
<title>MeasureVision — History</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar__brand"><span class="dot"></span>History</div>
    <div class="topbar__actions">
      <button class="icon-btn" aria-label="Filter">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
          <div class="nav-menu">
        <button class="icon-btn nav-menu__trigger" id="nav-menu-toggle" aria-label="Menu navigasi" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="nav-menu__panel" id="nav-menu-panel" hidden>
          <a class="nav-menu__item" href="home.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9.5a1 1 0 0 0 1 1h3.5v-6h5v6H18a1 1 0 0 0 1-1V10"/></svg>
            Home
          </a>
          <a class="nav-menu__item" href="camera.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1-2h7l1 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.25"/></svg>
            Camera
          </a>
          <a class="nav-menu__item" href="calibration.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            Calibration
          </a>
          <a class="nav-menu__item" href="measurement.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="1"/><path d="M7 8.5v3M11 8.5v3M15 8.5v3M19 8.5v3"/></svg>
            Measurement
          </a>
          <a class="nav-menu__item" href="history.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            History
          </a>
        </div>
      </div>
</div>
  </header>

  <main class="screen">
    <div class="screen__header">
      <p class="eyebrow">3 pengukuran</p>
      <h1 class="screen__title">Riwayat</h1>
    </div>

    <div class="card card--pad" style="margin-bottom: var(--sp-5);">
      <div class="hist-item">
        <div class="hist-item__thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        </div>
        <div class="hist-item__body">
          <p class="hist-item__title">Komponen PCB #04</p>
          <p class="hist-item__meta">02 AGU 2026 · 14:22</p>
        </div>
        <p class="hist-item__value mono">18.42mm</p>
      </div>
      <div class="hist-item">
        <div class="hist-item__thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        </div>
        <div class="hist-item__body">
          <p class="hist-item__title">Mur M6</p>
          <p class="hist-item__meta">01 AGU 2026 · 09:10</p>
        </div>
        <p class="hist-item__value mono">10.05mm</p>
      </div>
      <div class="hist-item" style="border-bottom: none;">
        <div class="hist-item__thumb">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        </div>
        <div class="hist-item__body">
          <p class="hist-item__title">Konektor JST</p>
          <p class="hist-item__meta">31 JUL 2026 · 17:45</p>
        </div>
        <p class="hist-item__value mono">2.54mm</p>
      </div>
    </div>

    <div class="tick-divider--labeled">
      <span>Belum ada data</span><div class="rule"></div>
    </div>

    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <p class="empty-state__title">Contoh: keadaan kosong</p>
      <p class="empty-state__body">Hasil pengukuran yang disimpan akan muncul di sini.</p>
    </div>
  </main>

</div>
<script type="module" src="js/core/router.js"></script>
<script type="module" src="js/core/cameraPageController.js"></script>
<script type="module" src="js/core/projectPageController.js"></script>
<script type="module" src="js/core/calibrationPageController.js"></script>
<script type="module" src="js/core/navMenuController.js"></script>
</body>
</html>
