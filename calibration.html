<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121517">
<title>MeasureVision — Calibration</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="icon-btn" href="home.html" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <div class="topbar__brand"><span class="dot"></span>Calibration</div>
    <span class="badge badge--neutral" id="calib-session-badge">idle</span>
  </header>

  <main class="screen" style="padding-top: var(--sp-4);">
    <div class="card card--pad" id="calib-error-banner" style="display:none; margin-bottom: var(--sp-4); border-color: var(--danger);">
      <p class="eyebrow" style="color: var(--danger); margin-bottom:6px;">Error</p>
      <p id="calib-error-text" style="font-size: var(--fs-sm); color: var(--text-primary); margin:0;"></p>
    </div>

    <!-- Sama seperti Camera: #preview-container dikosongkan total oleh
         Camera Engine tiap kali dibuka, jadi SEMUA kontrol ditaruh
         sebagai sibling (.cam-overlay-ui), bukan child, supaya tetap
         mengambang & terlihat di atas video live tanpa perlu scroll. -->
    <div class="cam-stage" style="margin-bottom: var(--sp-5);">
      <div class="viewfinder" id="calib-preview-container">
        <p class="eyebrow" id="calib-preview-placeholder" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 var(--sp-6);">Preview belum aktif</p>
      </div>

      <div class="cam-overlay-ui">
        <!-- Guide referensi: bentuk mengikuti Tipe Referensi yang dipilih,
             murni bantu visual untuk memposisikan objek — tidak dihitung. -->
        <div id="reference-guide" class="reference-guide" hidden></div>

        <!-- Titik yang sudah di-tap muncul di sini, dalam koordinat CSS
             (dikonversi balik dari koordinat native saat digambar). -->
        <div id="point-marker-a" class="point-marker" hidden></div>
        <div id="point-marker-b" class="point-marker" hidden></div>

        <div class="cam-menu">
          <button class="cam-icon-btn cam-menu__trigger" id="cam-menu-toggle" aria-label="Menu kalibrasi" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
          </button>
          <div class="cam-menu__panel" id="cam-menu-panel" hidden>
            <button class="cam-menu__item" id="btn-calib-open-camera">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5v8"/><path d="M6.5 5.8a8 8 0 1 0 11 0"/></svg>
              Buka Kamera
            </button>
            <button class="cam-menu__item" id="btn-calib-close-camera">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
              Tutup Kamera
            </button>
            <div class="cam-menu__divider"></div>
            <p class="cam-menu__label">Tipe Referensi</p>
            <button class="cam-menu__item ref-type-item" data-type="coin" data-length="25" data-unit="mm">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="8"/></svg>
              Koin (ISO 25mm)
            </button>
            <button class="cam-menu__item ref-type-item" data-type="idcard" data-length="85.6" data-unit="mm">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="7" width="18" height="10" rx="1.5"/></svg>
              Kartu ID (85.6mm)
            </button>
            <button class="cam-menu__item ref-type-item" data-type="marker" data-length="" data-unit="mm">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
              Marker Cetak Khusus
            </button>
            <button class="cam-menu__item ref-type-item" data-type="manual" data-length="" data-unit="mm">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h16M12 4v16"/></svg>
              Manual (tanpa guide)
            </button>
            <div class="cam-menu__divider"></div>
            <button class="cam-menu__item" id="btn-reset-points">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
              Ulangi Titik
            </button>
            <button class="cam-menu__item" id="btn-save-calibration">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h11l3 3v11H5z"/><path d="M8 5v5h7V5M8 19v-6h8v6"/></svg>
              Simpan Kalibrasi
            </button>
          </div>
        </div>

        <p class="cam-hint" id="cam-hint">Buka menu (⋮) untuk mulai</p>
      </div>
    </div>

    <div class="card card--pad" style="margin-bottom: var(--sp-4);">
      <div class="toggle-row">
        <div>
          <p class="toggle-row__label">Profil Kalibrasi Aktif</p>
          <p class="toggle-row__hint" id="active-profile-label">Belum ada — buat dulu</p>
        </div>
        <button class="btn btn--secondary" id="btn-new-profile" style="width:auto; height:36px; font-size:var(--fs-xs); padding:0 var(--sp-3);">+ Baru</button>
      </div>
    </div>

    <div class="field">
      <label class="field__label" for="ref-length">Panjang Referensi</label>
      <div class="unit-input">
        <input class="input" id="ref-length" type="number" inputmode="decimal" placeholder="25">
        <select class="select" id="ref-unit" style="width:90px; border-radius: 0 var(--radius-md) var(--radius-md) 0;">
          <option value="mm">mm</option>
          <option value="cm">cm</option>
          <option value="in">in</option>
        </select>
      </div>
    </div>

    <div class="card card--pad" style="display:flex; justify-content:space-between; align-items:center; margin: var(--sp-2) 0 var(--sp-6);">
      <div>
        <p class="eyebrow" style="margin-bottom:4px;">Rasio piksel/unit</p>
        <p class="mono" style="font-size: var(--fs-lg); color: var(--accent);" id="ppu-result">— px/unit</p>
      </div>
      <span class="badge badge--neutral" id="quality-badge">Menunggu</span>
    </div>

    <div class="btn-row">
      <button class="btn btn--secondary" id="btn-compute">Hitung</button>
      <button class="btn btn--primary" id="btn-save-bottom">Simpan Kalibrasi</button>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a class="bottom-nav__item" href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9.5a1 1 0 0 0 1 1h3.5v-6h5v6H18a1 1 0 0 0 1-1V10"/></svg>
      <span>Home</span>
    </a>
    <a class="bottom-nav__item" href="camera.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1-2h7l1 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.25"/></svg>
      <span>Camera</span>
    </a>
    <a class="bottom-nav__item" href="calibration.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Calib.</span>
    </a>
    <a class="bottom-nav__item" href="measurement.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="1"/><path d="M7 8.5v3M11 8.5v3M15 8.5v3M19 8.5v3"/></svg>
      <span>Measure</span>
    </a>
    <a class="bottom-nav__item" href="history.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>History</span>
    </a>
  </nav>

  <style>
    /* Scoped ke halaman Calibration saja — pola identik dengan Camera:
       kontrol mengambang di atas preview, tidak butuh scroll. */
    .cam-stage { position: relative; }
    .cam-overlay-ui {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .cam-menu { position: absolute; top: var(--sp-3); right: var(--sp-3); pointer-events: auto; }
    .cam-menu__trigger { background: rgba(13,15,17,0.72); border: 1px solid rgba(255,255,255,0.12); }
    .cam-menu__panel {
      position: absolute; top: 46px; right: 0;
      min-width: 220px; max-height: 70vh; overflow-y: auto;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-float);
      padding: var(--sp-2);
      display: flex; flex-direction: column; gap: 2px;
      z-index: 60;
    }
    .cam-menu__label {
      font-family: var(--font-mono); font-size: var(--fs-2xs); letter-spacing: var(--tracking-wide);
      text-transform: uppercase; color: var(--text-tertiary);
      padding: var(--sp-2) var(--sp-3) 2px;
    }
    .cam-menu__divider { height: 1px; background: var(--line); margin: var(--sp-1) 0; }
    .cam-menu__item {
      display: flex; align-items: center; gap: var(--sp-3);
      width: 100%; padding: var(--sp-2) var(--sp-3);
      background: transparent; border: none; border-radius: var(--radius-md);
      color: var(--text-primary); font-size: var(--fs-sm); text-align: left;
    }
    .cam-menu__item svg { width: 18px; height: 18px; stroke: var(--text-secondary); flex-shrink: 0; }
    .cam-menu__item:active { background: var(--bg-panel-raised); }
    .ref-type-item[aria-checked="true"] { color: var(--accent); background: var(--accent-wash); }
    .ref-type-item[aria-checked="true"] svg { stroke: var(--accent); }
    #btn-open-camera { color: var(--ok); } #btn-open-camera svg { stroke: var(--ok); }
    #btn-close-camera { color: var(--danger); } #btn-close-camera svg { stroke: var(--danger); }
    #btn-save-calibration { color: var(--accent); } #btn-save-calibration svg { stroke: var(--accent); }

    /* Guide bentuk referensi — murni visual, tidak dihitung */
    .reference-guide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border: 2px dashed var(--accent);
      pointer-events: none;
    }
    .reference-guide--coin { border-radius: 50%; width: 38%; aspect-ratio: 1/1; }
    .reference-guide--idcard { width: 72%; aspect-ratio: 1.586/1; border-radius: var(--radius-md); }
    .reference-guide--marker { width: 42%; aspect-ratio: 1/1; border-radius: var(--radius-sm); }

    .point-marker {
      position: absolute; width: 16px; height: 16px; margin-left: -8px; margin-top: -8px;
      border-radius: 50%; background: var(--ok); border: 2px solid white;
      pointer-events: none; z-index: 55;
    }
    .cam-hint {
      position: absolute; left: 50%; bottom: var(--sp-3); transform: translateX(-50%);
      background: rgba(13,15,17,0.72); border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 14px; border-radius: 100px;
      font-size: var(--fs-xs); color: var(--text-secondary);
      white-space: nowrap; pointer-events: none;
    }
  </style>

</div>
<script type="module" src="js/core/router.js"></script>
<script type="module" src="js/core/cameraPageController.js"></script>
<script type="module" src="js/core/projectPageController.js"></script>
<script type="module" src="js/core/calibrationPageController.js"></script>
</body>
</html>
