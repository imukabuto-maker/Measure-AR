<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121517">
<title>MeasureVision — Project</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="icon-btn" href="home.html" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <div class="topbar__brand"><span class="dot"></span>Project</div>
    <button class="icon-btn" aria-label="Project baru" id="btn-new-project-top">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
        <div class="nav-menu">
        <button class="icon-btn nav-menu__trigger" id="nav-menu-toggle" aria-label="Menu navigasi" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="nav-menu__panel" id="nav-menu-panel" hidden>
          <a class="nav-menu__item" href="home.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9.5a1 1 0 0 0 1 1h3.5v-6h5v6H18a1 1 0 0 0 1-1V10"/></svg>
            Home
          </a>
          <a class="nav-menu__item" href="camera.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1-2h7l1 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3.25"/></svg>
            Camera
          </a>
          <a class="nav-menu__item" href="calibration.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            Calibration
          </a>
          <a class="nav-menu__item" href="measurement.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="7" rx="1"/><path d="M7 8.5v3M11 8.5v3M15 8.5v3M19 8.5v3"/></svg>
            Measurement
          </a>
          <a class="nav-menu__item" href="history.html">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            History
          </a>
        </div>
      </div>
  </header>

  <main class="screen">
    <div class="screen__header">
      <p class="eyebrow" id="project-count-label">Memuat…</p>
      <h1 class="screen__title">Project</h1>
      <p class="screen__subtitle">Kelompokkan pengukuran berdasarkan pekerjaan atau batch.</p>
    </div>

    <div class="card card--pad" id="camera-error-banner-project" style="display:none; margin-bottom: var(--sp-4); border-color: var(--danger);">
      <p class="eyebrow" style="color: var(--danger); margin-bottom:6px;">Error</p>
      <p id="project-error-text" style="font-size: var(--fs-sm); color: var(--text-primary); margin:0;"></p>
    </div>

    <div id="project-list-container">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a1 1 0 0 1 1-1h5l1.5 2H20a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
        <p class="empty-state__title">Memuat daftar project…</p>
        <p class="empty-state__body">Mohon tunggu sebentar.</p>
      </div>
    </div>

    <button class="btn btn--primary" id="btn-new-project-bottom" style="margin-top: var(--sp-4);">+ Project Baru</button>
  </main>

</div>
<script type="module" src="js/core/router.js"></script>
<script type="module" src="js/core/cameraPageController.js"></script>
<script type="module" src="js/core/projectPageController.js"></script>
<script type="module" src="js/core/calibrationPageController.js"></script>
<script type="module" src="js/core/navMenuController.js"></script>
</body>
</html>
