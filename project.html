<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121517">
<title>MeasureVision — Project</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="icon-btn" href="home.html" aria-label="Kembali">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <div class="topbar__brand"><span class="dot"></span>Project</div>
    <button class="icon-btn" aria-label="Project baru">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main class="screen">
    <div class="screen__header">
      <p class="eyebrow">1 project</p>
      <h1 class="screen__title">Project</h1>
      <p class="screen__subtitle">Kelompokkan pengukuran berdasarkan pekerjaan atau batch.</p>
    </div>

    <div class="card card--pad" style="border-color: var(--accent); margin-bottom: var(--sp-4);">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <p style="font-size: var(--fs-md); font-weight:600;">Untitled Project</p>
          <p class="mono" style="font-size: var(--fs-2xs); color: var(--text-tertiary); margin-top:4px; text-transform:uppercase; letter-spacing: var(--tracking-wide);">0 item · dibuat hari ini</p>
        </div>
        <span class="badge badge--ok">Aktif</span>
      </div>
    </div>

    <div class="tick-divider" role="presentation"></div>

    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a1 1 0 0 1 1-1h5l1.5 2H20a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
      <p class="empty-state__title">Belum ada project lain</p>
      <p class="empty-state__body">Buat project baru untuk memisahkan sesi pengukuran.</p>
    </div>

    <button class="btn btn--primary" style="margin-top: var(--sp-4);">+ Project Baru</button>
  </main>

</div>
<script type="module" src="js/core/router.js"></script>
<script type="module" src="js/core/cameraPageController.js"></script>
</body>
</html>
