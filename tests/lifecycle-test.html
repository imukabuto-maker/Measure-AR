<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121517">
<title>Test — Camera Lifecycle Manager</title>
<!-- Halaman uji manual khusus Sprint 10. Berdiri sendiri, TIDAK
     terhubung ke router/navigasi utama, dan tidak mengubah UI
     halaman lain. Memakai token & komponen CSS yang sudah ada. -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__brand"><span class="dot"></span>Test: Lifecycle Manager</div>
  </header>

  <main class="screen">
    <div class="screen__header">
      <p class="eyebrow">Sprint 10 — QA Manual</p>
      <h1 class="screen__title">Camera Lifecycle</h1>
      <p class="screen__subtitle">Start, lalu coba: kunci layar/switch app lalu kembali, putar device, dan pause/resume manual. Wajib HTTPS.</p>
    </div>

    <div class="card card--pad" id="error-banner" style="display:none; margin-bottom: var(--sp-4); border-color: var(--danger);">
      <p class="eyebrow" style="color: var(--danger); margin-bottom:6px;">Error Terdeteksi</p>
      <p id="error-banner-text" class="mono" style="font-size: var(--fs-xs); color: var(--text-primary); white-space:pre-wrap; margin:0;"></p>
    </div>

    <div class="viewfinder" id="preview-container" style="margin-bottom: var(--sp-4); display:flex; align-items:center; justify-content:center;">
      <p class="eyebrow" id="preview-placeholder">Sesi belum dimulai</p>
    </div>

    <div class="card card--pad" style="margin-bottom: var(--sp-4);">
      <div class="toggle-row">
        <div>
          <p class="toggle-row__label">Session</p>
          <p class="toggle-row__hint" id="session-status">inactive</p>
        </div>
        <span class="badge badge--neutral" id="session-badge">INACTIVE</span>
      </div>
      <div class="toggle-row">
        <div>
          <p class="toggle-row__label">Resolusi (diminta / aktual)</p>
          <p class="toggle-row__hint" id="resolution-status">– / –</p>
        </div>
      </div>
      <div class="toggle-row">
        <div>
          <p class="toggle-row__label">Orientasi</p>
          <p class="toggle-row__hint" id="orientation-status">–</p>
        </div>
      </div>
    </div>

    <div class="btn-row" style="margin-bottom: var(--sp-3);">
      <button class="btn btn--primary" id="btn-start">Start Session</button>
      <button class="btn btn--secondary" id="btn-stop">Stop Session</button>
    </div>
    <div class="btn-row" style="margin-bottom: var(--sp-5);">
      <button class="btn btn--secondary" id="btn-pause">Pause (manual)</button>
      <button class="btn btn--secondary" id="btn-resume">Resume</button>
    </div>

    <div class="card card--pad">
      <p class="eyebrow" style="margin-bottom:6px;">Log</p>
      <pre id="log" class="mono" style="font-size:var(--fs-xs); color:var(--text-secondary); white-space:pre-wrap; margin:0;"></pre>
    </div>
  </main>
</div>

<script>
  function showFatalError(title, detail) {
    const banner = document.getElementById('error-banner');
    const text = document.getElementById('error-banner-text');
    if (banner && text) {
      banner.style.display = 'block';
      text.textContent += `${title}\n${detail}\n\n`;
    }
    const logEl = document.getElementById('log');
    if (logEl) logEl.textContent += `[FATAL] ${title}: ${detail}\n`;
  }
  window.addEventListener('error', (event) => {
    showFatalError('window.error', event.message || String(event.error) || 'Unknown error');
  });
  window.addEventListener('unhandledrejection', (event) => {
    showFatalError('unhandledrejection', event.reason && event.reason.message ? event.reason.message : String(event.reason));
  });
</script>

<script type="module">
  const container = document.getElementById('preview-container');
  const placeholder = document.getElementById('preview-placeholder');
  const sessionStatusEl = document.getElementById('session-status');
  const sessionBadgeEl = document.getElementById('session-badge');
  const resolutionStatusEl = document.getElementById('resolution-status');
  const orientationStatusEl = document.getElementById('orientation-status');
  const logEl = document.getElementById('log');

  function log(message) {
    const time = new Date().toLocaleTimeString('id-ID');
    logEl.textContent += `[${time}] ${message}\n`;
  }

  function fatal(title, err) {
    const detail = (err && err.message) ? err.message : String(err);
    const banner = document.getElementById('error-banner');
    const text = document.getElementById('error-banner-text');
    banner.style.display = 'block';
    text.textContent += `${title}\n${detail}\n\n`;
    log(`[FATAL] ${title}: ${detail}`);
  }

  log('Memuat module cameraLifecycleManager.js...');

  let lifecycle;
  try {
    lifecycle = await import('../js/core/cameraLifecycleManager.js');
    log('Module berhasil dimuat.');
  } catch (err) {
    fatal('Gagal memuat module', err);
    throw err;
  }

  const {
    startCameraLifecycle, pauseCameraLifecycle, resumeCameraLifecycle, stopCameraLifecycle,
    onSessionStateChange, getSessionState,
    onResolutionStateChange, getResolutionState,
    onOrientationChange, getOrientation,
  } = lifecycle;

  const SESSION_BADGE_CLASS = {
    inactive: 'badge--neutral', starting: 'badge--warn', active: 'badge--ok',
    paused: 'badge--warn', stopping: 'badge--neutral', error: 'badge--danger',
  };

  onSessionStateChange((state) => {
    sessionStatusEl.textContent = state.errorMessage
      ? `${state.status} — ${state.errorMessage}`
      : `${state.status}${state.pausedByVisibility ? ' (auto: app background)' : ''}`;
    sessionBadgeEl.textContent = state.status.toUpperCase();
    sessionBadgeEl.className = 'badge ' + (SESSION_BADGE_CLASS[state.status] || 'badge--neutral');

    placeholder.style.display = state.status === 'active' ? 'none' : 'block';
    if (state.status !== 'active') {
      placeholder.textContent = state.status === 'starting' ? 'Membuka kamera...' : `Sesi: ${state.status}`;
    }
    log(`session → ${state.status}${state.pausedByVisibility ? ' (dipicu visibilitychange)' : ''}${state.errorMessage ? ' — ' + state.errorMessage : ''}`);
  });

  onResolutionStateChange((state) => {
    resolutionStatusEl.textContent = `${state.requested.width}×${state.requested.height} / ${state.actual.width}×${state.actual.height}`;
    log(`resolution → diminta ${state.requested.width}x${state.requested.height}, aktual ${state.actual.width}x${state.actual.height}`);
  });

  onOrientationChange((orientation) => {
    orientationStatusEl.textContent = orientation;
    log(`orientation → ${orientation}`);
  });

  const initialSession = getSessionState();
  sessionStatusEl.textContent = initialSession.status;
  const initialRes = getResolutionState();
  resolutionStatusEl.textContent = `${initialRes.requested.width}×${initialRes.requested.height} / ${initialRes.actual.width}×${initialRes.actual.height}`;
  orientationStatusEl.textContent = getOrientation();

  document.getElementById('btn-start').addEventListener('click', async () => {
    log('Start session...');
    try {
      const result = await startCameraLifecycle(container);
      if (!result.success) log(`Gagal: [${result.error.code}] ${result.error.message}`);
    } catch (err) {
      fatal('Error saat startCameraLifecycle()', err);
    }
  });

  document.getElementById('btn-stop').addEventListener('click', () => {
    log('Stop session...');
    try {
      stopCameraLifecycle();
      placeholder.textContent = 'Sesi belum dimulai';
      placeholder.style.display = 'block';
    } catch (err) {
      fatal('Error saat stopCameraLifecycle()', err);
    }
  });

  document.getElementById('btn-pause').addEventListener('click', () => {
    log('Pause session (manual)...');
    try {
      pauseCameraLifecycle();
    } catch (err) {
      fatal('Error saat pauseCameraLifecycle()', err);
    }
  });

  document.getElementById('btn-resume').addEventListener('click', async () => {
    log('Resume session...');
    try {
      const result = await resumeCameraLifecycle();
      if (!result.success) log(`Gagal resume: [${result.error.code}] ${result.error.message}`);
    } catch (err) {
      fatal('Error saat resumeCameraLifecycle()', err);
    }
  });

  // Bantuan observasi manual: catat setiap kali visibility document berubah
  document.addEventListener('visibilitychange', () => {
    log(`document.visibilitychange → hidden=${document.hidden}`);
  });
</script>
</body>
</html>
