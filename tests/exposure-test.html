<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121517">
<title>Test — Exposure Manager</title>
<!-- Halaman uji manual khusus Sprint 8. Berdiri sendiri, TIDAK
     terhubung ke router/navigasi utama, dan tidak mengubah UI
     halaman lain. Memakai token & komponen CSS yang sudah ada. -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<style>
  .exposure-slider { width: 100%; accent-color: var(--accent); height: 40px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__brand"><span class="dot"></span>Test: Exposure Manager</div>
  </header>

  <main class="screen">
    <div class="screen__header">
      <p class="eyebrow">Sprint 8 — QA Manual</p>
      <h1 class="screen__title">Exposure Manager</h1>
      <p class="screen__subtitle">Buka kamera dulu, lalu coba slider exposure atau Lock/Unlock. Wajib HTTPS (GitHub Pages).</p>
    </div>

    <div class="card card--pad" id="error-banner" style="display:none; margin-bottom: var(--sp-4); border-color: var(--danger);">
      <p class="eyebrow" style="color: var(--danger); margin-bottom:6px;">Error Terdeteksi</p>
      <p id="error-banner-text" class="mono" style="font-size: var(--fs-xs); color: var(--text-primary); white-space:pre-wrap; margin:0;"></p>
    </div>

    <div class="viewfinder" id="preview-container" style="margin-bottom: var(--sp-4); display:flex; align-items:center; justify-content:center;">
      <p class="eyebrow" id="preview-placeholder">Preview belum aktif</p>
    </div>

    <div class="card card--pad" style="margin-bottom: var(--sp-4);">
      <div class="toggle-row">
        <div>
          <p class="toggle-row__label">Status Kamera</p>
          <p class="toggle-row__hint" id="camera-status">idle</p>
        </div>
        <span class="badge badge--neutral" id="camera-badge">IDLE</span>
      </div>
      <div class="toggle-row">
        <div>
          <p class="toggle-row__label">Status Exposure</p>
          <p class="toggle-row__hint" id="exposure-status">idle</p>
        </div>
        <span class="badge badge--neutral" id="exposure-badge">IDLE</span>
      </div>
    </div>

    <div class="btn-row" style="margin-bottom: var(--sp-4);">
      <button class="btn btn--primary" id="btn-open">Open Camera</button>
      <button class="btn btn--secondary" id="btn-close">Close Camera</button>
    </div>

    <div class="field">
      <label class="field__label" for="exposure-slider">Exposure Compensation (<span id="exposure-value">0.0</span> EV)</label>
      <input type="range" id="exposure-slider" class="exposure-slider" min="-2" max="2" step="0.1" value="0">
    </div>

    <div class="btn-row" style="margin-bottom: var(--sp-5);">
      <button class="btn btn--secondary" id="btn-lock">Lock Exposure</button>
      <button class="btn btn--secondary" id="btn-unlock">Unlock Exposure</button>
    </div>

    <div class="card card--pad">
      <p class="eyebrow" style="margin-bottom:6px;">Log</p>
      <pre id="log" class="mono" style="font-size:var(--fs-xs); color:var(--text-secondary); white-space:pre-wrap; margin:0;"></pre>
    </div>
  </main>
</div>

<script>
  // Script biasa (bukan module) — selalu jalan meski module gagal
  // dimuat, agar error apa pun tetap terlihat di layar tanpa
  // perlu Safari Console/komputer.
  function showFatalError(title, detail) {
    const banner = document.getElementById('error-banner');
    const text = document.getElementById('error-banner-text');
    if (banner && text) {
      banner.style.display = 'block';
      text.textContent += `${title}\n${detail}\n\n`;
    }
    const logEl = document.getElementById('log');
    if (logEl) logEl.textContent += `[FATAL] ${title}: ${detail}\n`;
  }
  window.addEventListener('error', (event) => {
    showFatalError('window.error', event.message || String(event.error) || 'Unknown error');
  });
  window.addEventListener('unhandledrejection', (event) => {
    showFatalError('unhandledrejection', event.reason && event.reason.message ? event.reason.message : String(event.reason));
  });
</script>

<script type="module">
  const container = document.getElementById('preview-container');
  const placeholder = document.getElementById('preview-placeholder');
  const cameraStatusEl = document.getElementById('camera-status');
  const cameraBadgeEl = document.getElementById('camera-badge');
  const exposureStatusEl = document.getElementById('exposure-status');
  const exposureBadgeEl = document.getElementById('exposure-badge');
  const exposureSlider = document.getElementById('exposure-slider');
  const exposureValueLabel = document.getElementById('exposure-value');
  const logEl = document.getElementById('log');

  function log(message) {
    const time = new Date().toLocaleTimeString('id-ID');
    logEl.textContent += `[${time}] ${message}\n`;
  }

  function fatal(title, err) {
    const detail = (err && err.message) ? err.message : String(err);
    const banner = document.getElementById('error-banner');
    const text = document.getElementById('error-banner-text');
    banner.style.display = 'block';
    text.textContent += `${title}\n${detail}\n\n`;
    log(`[FATAL] ${title}: ${detail}`);
  }

  log('Memuat module cameraManager.js & exposureManager.js...');

  let cameraManager, exposureManager;
  try {
    [cameraManager, exposureManager] = await Promise.all([
      import('../js/core/cameraManager.js'),
      import('../js/core/exposureManager.js'),
    ]);
    log('Module berhasil dimuat.');
  } catch (err) {
    fatal('Gagal memuat module', err);
    throw err;
  }

  const { openCamera, closeCamera, onCameraStateChange, getCameraState } = cameraManager;
  const { setExposureCompensation, lockExposure, unlockExposure, onExposureStateChange, getExposureState } = exposureManager;

  const CAMERA_BADGE_CLASS = {
    idle: 'badge--neutral', opening: 'badge--warn', previewing: 'badge--ok',
    closed: 'badge--neutral', error: 'badge--danger',
  };
  const EXPOSURE_BADGE_CLASS = {
    idle: 'badge--ok', adjusting: 'badge--warn', locked: 'badge--ok',
    unsupported: 'badge--neutral', error: 'badge--danger',
  };

  onCameraStateChange((state) => {
    cameraStatusEl.textContent = state.errorMessage
      ? `${state.status} — ${state.errorMessage}`
      : `${state.status} (facing: ${state.facingMode})`;
    cameraBadgeEl.textContent = state.status.toUpperCase();
    cameraBadgeEl.className = 'badge ' + (CAMERA_BADGE_CLASS[state.status] || 'badge--neutral');

    placeholder.style.display = state.status === 'previewing' ? 'none' : 'block';
    if (state.status !== 'previewing') {
      placeholder.textContent = state.status === 'opening' ? 'Membuka kamera...' : 'Preview belum aktif';
    }
    log(`camera state → ${state.status}${state.errorMessage ? ' (' + state.errorMessage + ')' : ''}`);
  });

  onExposureStateChange((state) => {
    exposureStatusEl.textContent = state.errorMessage
      ? `${state.status} (${state.mode}) — ${state.errorMessage}`
      : `${state.status} (mode: ${state.mode})`;
    exposureBadgeEl.textContent = state.status.toUpperCase();
    exposureBadgeEl.className = 'badge ' + (EXPOSURE_BADGE_CLASS[state.status] || 'badge--neutral');

    exposureValueLabel.textContent = state.compensation.toFixed(1);
    exposureSlider.min = state.min;
    exposureSlider.max = state.max;
    exposureSlider.step = state.step;
    exposureSlider.value = state.compensation;
    exposureSlider.disabled = state.mode === 'none';

    log(`exposure state → ${state.status} mode=${state.mode} EV=${state.compensation.toFixed(2)}${state.errorMessage ? ' (' + state.errorMessage + ')' : ''}`);
  });

  const initialCamera = getCameraState();
  cameraStatusEl.textContent = `${initialCamera.status} (facing: ${initialCamera.facingMode})`;
  const initialExposure = getExposureState();
  exposureStatusEl.textContent = `${initialExposure.status} (mode: ${initialExposure.mode})`;

  document.getElementById('btn-open').addEventListener('click', async () => {
    log('Membuka kamera...');
    try {
      const result = await openCamera(container);
      if (!result.success) log(`Gagal: [${result.error.code}] ${result.error.message}`);
    } catch (err) {
      fatal('Error saat openCamera()', err);
    }
  });

  document.getElementById('btn-close').addEventListener('click', () => {
    log('Menutup kamera...');
    try {
      closeCamera();
      placeholder.textContent = 'Preview belum aktif';
      placeholder.style.display = 'block';
    } catch (err) {
      fatal('Error saat closeCamera()', err);
    }
  });

  exposureSlider.addEventListener('input', async (event) => {
    try {
      await setExposureCompensation(Number(event.target.value));
    } catch (err) {
      fatal('Error saat setExposureCompensation()', err);
    }
  });

  document.getElementById('btn-lock').addEventListener('click', async () => {
    log('Mengunci exposure...');
    try {
      const status = await lockExposure();
      log(`Hasil lockExposure(): ${status}`);
    } catch (err) {
      fatal('Error saat lockExposure()', err);
    }
  });

  document.getElementById('btn-unlock').addEventListener('click', async () => {
    log('Melepas exposure lock...');
    try {
      const status = await unlockExposure();
      log(`Hasil unlockExposure(): ${status}`);
    } catch (err) {
      fatal('Error saat unlockExposure()', err);
    }
  });
</script>
</body>
</html>
